<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Finlandica+Headline:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Counter App</title>
  </head>
  <body>
    <div id="main">
      <main>
        <header>
          <h1>Counter App</h1>
        </header>
        <div id="content">
          <article>
            <p>
              <span class="content-italic_font">Counter app</span> adalah
              aplikasi yang berfungsi untuk melacak dan mencatat jumlah atau
              frekuensi.
            </p>
            <p>
              Tekan tombol simbol " + " untuk menambah jumlah, dan simbol " - "
              untuk mengurangi.
            </p>
            <div id="counter">
              <button id="counter-increment_button">+</button
              ><span id="counter-total">0</span
              ><button id="counter-decrement_button">-</button>
            </div>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>
